<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="540" fill="#FAFAFA"/>

  <!-- eyebrow -->
  <text x="56" y="72" fill="#9B9B9B" font-size="12" letter-spacing="2.5" font-weight="600">CONCEPT VALIDATION</text>
  <text x="56" y="104" fill="#1A1A1A" font-size="24" font-weight="500">It landed as recognition, not curiosity</text>

  <!-- quote bubble -->
  <rect x="56" y="148" width="608" height="78" rx="14" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M96 226l0 22 24 -22z" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <path d="M98 226h22" stroke="#FFFFFF" stroke-width="2"/>
  <text x="84" y="184" fill="#1A1A1A" font-size="19" font-style="italic">“I literally do this in my Notes app.”</text>
  <text x="84" y="210" fill="#9B9B9B" font-size="13">— every tester who cooks like Maya</text>

  <!-- signal bars -->
  <g>
    <text x="56" y="300" fill="#1A1A1A" font-size="14" font-weight="500">Core loop is real</text>
    <rect x="320" y="288" width="344" height="14" rx="7" fill="#E5E5E5"/>
    <rect x="320" y="288" width="328" height="14" rx="7" fill="#1A1A1A"/>
  </g>
  <g>
    <text x="56" y="344" fill="#1A1A1A" font-size="14" font-weight="500">Saving must be instant</text>
    <rect x="320" y="332" width="344" height="14" rx="7" fill="#E5E5E5"/>
    <rect x="320" y="332" width="310" height="14" rx="7" fill="#1A1A1A"/>
  </g>
  <g>
    <text x="56" y="388" fill="#1A1A1A" font-size="14" font-weight="500">Stay in control of data</text>
    <rect x="320" y="376" width="344" height="14" rx="7" fill="#E5E5E5"/>
    <rect x="320" y="376" width="268" height="14" rx="7" fill="#1A1A1A"/>
  </g>
  <g>
    <text x="56" y="432" fill="#1A1A1A" font-size="14" font-weight="500">Sharing with a partner</text>
    <rect x="320" y="420" width="344" height="14" rx="7" fill="#E5E5E5"/>
    <rect x="320" y="420" width="296" height="14" rx="7" fill="#1A1A1A"/>
  </g>

  <!-- caption -->
  <text x="56" y="488" fill="#6B6B6B" font-size="13">Signals that shaped scope: protect one-tap save · curate, don’t override · sharing is core.</text>
</svg>
