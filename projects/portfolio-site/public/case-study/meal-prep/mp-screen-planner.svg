<svg width="440" height="560" viewBox="0 0 440 560" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="440" height="560" fill="#FAFAFA"/>
  <!-- phone frame -->
  <rect x="120" y="36" width="200" height="488" rx="28" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="186" y="52" width="68" height="6" rx="3" fill="#E5E5E5"/>

  <!-- header -->
  <text x="140" y="100" fill="#1A1A1A" font-size="16" font-weight="600">This week</text>
  <rect x="262" y="86" width="38" height="20" rx="10" fill="#1A1A1A"/>
  <text x="281" y="100" fill="#FFFFFF" font-size="10" text-anchor="middle">Copy</text>

  <!-- day rows -->
  <g>
    <text x="140" y="142" fill="#9B9B9B" font-size="11" font-weight="600">MON</text>
    <rect x="140" y="150" width="160" height="34" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="150" y="161" width="90" height="7" rx="3" fill="#1A1A1A"/>
    <rect x="150" y="172" width="56" height="6" rx="3" fill="#9B9B9B"/>
  </g>
  <g>
    <text x="140" y="206" fill="#9B9B9B" font-size="11" font-weight="600">TUE</text>
    <rect x="140" y="214" width="160" height="34" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="150" y="225" width="74" height="7" rx="3" fill="#1A1A1A"/>
    <rect x="150" y="236" width="48" height="6" rx="3" fill="#9B9B9B"/>
  </g>
  <g>
    <text x="140" y="270" fill="#9B9B9B" font-size="11" font-weight="600">WED</text>
    <rect x="140" y="278" width="160" height="34" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="220" y="299" fill="#9B9B9B" font-size="11" text-anchor="middle">+ add a dish</text>
  </g>
  <g>
    <text x="140" y="334" fill="#9B9B9B" font-size="11" font-weight="600">THU</text>
    <rect x="140" y="342" width="160" height="34" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="150" y="353" width="84" height="7" rx="3" fill="#1A1A1A"/>
    <rect x="150" y="364" width="52" height="6" rx="3" fill="#9B9B9B"/>
  </g>
  <g>
    <text x="140" y="398" fill="#9B9B9B" font-size="11" font-weight="600">FRI</text>
    <rect x="140" y="406" width="160" height="34" rx="8" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
    <rect x="150" y="417" width="68" height="7" rx="3" fill="#1A1A1A"/>
    <rect x="150" y="428" width="44" height="6" rx="3" fill="#9B9B9B"/>
  </g>

  <!-- bottom nav -->
  <line x1="120" y1="470" x2="320" y2="470" stroke="#E5E5E5" stroke-width="1"/>
  <circle cx="160" cy="496" r="4" fill="#9B9B9B"/>
  <circle cx="220" cy="496" r="4" fill="#1A1A1A"/>
  <circle cx="280" cy="496" r="4" fill="#9B9B9B"/>
</svg>
