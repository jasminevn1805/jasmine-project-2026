<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="540" fill="#FAFAFA"/>

  <!-- eyebrow -->
  <text x="56" y="72" fill="#9B9B9B" font-size="12" letter-spacing="2.5" font-weight="600">STATE ARCHITECTURE</text>
  <text x="56" y="104" fill="#1A1A1A" font-size="24" font-weight="500">Five focused stores, one typed domain</text>

  <!-- five domain stores -->
  <g>
    <rect x="56" y="156" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="108" y="200" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">recipes</text>
    <text x="108" y="222" fill="#9B9B9B" font-size="10" text-anchor="middle">library</text>
  </g>
  <g>
    <rect x="180" y="156" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="232" y="200" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">planner</text>
    <text x="232" y="222" fill="#9B9B9B" font-size="10" text-anchor="middle">cal + freeform</text>
  </g>
  <g>
    <rect x="304" y="156" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="356" y="200" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">grocery</text>
    <text x="356" y="222" fill="#9B9B9B" font-size="10" text-anchor="middle">deduped</text>
  </g>
  <g>
    <rect x="428" y="156" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="480" y="200" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">categories</text>
    <text x="480" y="222" fill="#9B9B9B" font-size="10" text-anchor="middle">aisles</text>
  </g>
  <g>
    <rect x="552" y="156" width="104" height="92" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
    <text x="604" y="200" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">auth</text>
    <text x="604" y="222" fill="#9B9B9B" font-size="10" text-anchor="middle">session</text>
  </g>

  <!-- connectors down -->
  <line x1="108" y1="248" x2="108" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="232" y1="248" x2="232" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="356" y1="248" x2="356" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="480" y1="248" x2="480" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="604" y1="248" x2="604" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="108" y1="300" x2="604" y2="300" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="356" y1="300" x2="356" y2="328" stroke="#1A1A1A" stroke-width="1.5"/>

  <!-- typed domain layer -->
  <rect x="56" y="328" width="600" height="64" rx="10" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="356" y="358" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle">Typed domain models</text>
  <text x="356" y="378" fill="#6B6B6B" font-size="12" text-anchor="middle">ISO dates · UUID keys · nullable where a column would be — mirrors a future DB schema</text>

  <!-- persistence -->
  <line x1="356" y1="392" x2="356" y2="420" stroke="#1A1A1A" stroke-width="1.5"/>
  <rect x="248" y="420" width="216" height="44" rx="22" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="356" y="447" fill="#1A1A1A" font-size="13" font-weight="500" text-anchor="middle">localStorage-persisted</text>

  <text x="56" y="504" fill="#6B6B6B" font-size="13">Split by domain, so a change to grocery logic can’t ripple into the planner.</text>
</svg>
