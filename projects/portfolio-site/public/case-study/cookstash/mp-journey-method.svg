<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="540" fill="#FAFAFA"/>

  <!-- eyebrow -->
  <text x="56" y="72" fill="#9B9B9B" font-size="12" letter-spacing="2.5" font-weight="600">RESEARCH METHOD</text>
  <text x="56" y="104" fill="#1A1A1A" font-size="24" font-weight="500">Two real behaviours, mapped end to end</text>

  <!-- Scenario 1 lane -->
  <text x="56" y="172" fill="#1A1A1A" font-size="14" font-weight="600">Save to cook later</text>
  <line x1="56" y1="208" x2="664" y2="208" stroke="#E5E5E5" stroke-width="2"/>
  <!-- nodes -->
  <circle cx="96" cy="208" r="7" fill="#1A1A1A"/>
  <circle cx="218" cy="208" r="7" fill="#1A1A1A"/>
  <circle cx="340" cy="208" r="9" fill="#F43F5E"/>
  <circle cx="462" cy="208" r="9" fill="#F43F5E"/>
  <circle cx="584" cy="208" r="7" fill="#1A1A1A"/>
  <text x="96" y="240" fill="#9B9B9B" font-size="11" text-anchor="middle">Discover</text>
  <text x="218" y="240" fill="#9B9B9B" font-size="11" text-anchor="middle">Save</text>
  <text x="340" y="240" fill="#F43F5E" font-size="11" text-anchor="middle">Pile up</text>
  <text x="462" y="240" fill="#F43F5E" font-size="11" text-anchor="middle">Re-hunt</text>
  <text x="584" y="240" fill="#9B9B9B" font-size="11" text-anchor="middle">Cook</text>

  <!-- Scenario 2 lane -->
  <text x="56" y="320" fill="#1A1A1A" font-size="14" font-weight="600">Plan a meal-prep week</text>
  <line x1="56" y1="356" x2="664" y2="356" stroke="#E5E5E5" stroke-width="2"/>
  <circle cx="96" cy="356" r="9" fill="#F43F5E"/>
  <circle cx="218" cy="356" r="7" fill="#1A1A1A"/>
  <circle cx="340" cy="356" r="9" fill="#F43F5E"/>
  <circle cx="462" cy="356" r="7" fill="#1A1A1A"/>
  <circle cx="584" cy="356" r="9" fill="#F43F5E"/>
  <text x="96" y="388" fill="#F43F5E" font-size="11" text-anchor="middle">Reject apps</text>
  <text x="218" y="388" fill="#9B9B9B" font-size="11" text-anchor="middle">DIY Notes</text>
  <text x="340" y="388" fill="#F43F5E" font-size="11" text-anchor="middle">Type it all</text>
  <text x="462" y="388" fill="#9B9B9B" font-size="11" text-anchor="middle">Shop</text>
  <text x="584" y="388" fill="#F43F5E" font-size="11" text-anchor="middle">Repeat zero</text>

  <!-- legend -->
  <circle cx="64" cy="452" r="7" fill="#1A1A1A"/>
  <text x="80" y="457" fill="#6B6B6B" font-size="13">Smooth step</text>
  <circle cx="220" cy="452" r="9" fill="#F43F5E"/>
  <text x="238" y="457" fill="#6B6B6B" font-size="13">Friction point</text>

  <text x="56" y="500" fill="#1A1A1A" font-size="14" font-weight="500">Friction clusters in the same place: the handoff between finding a recipe and acting on it.</text>
</svg>
