<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="480" fill="#FAFAFA"/>

  <!-- eyebrow -->
  <text x="80" y="80" fill="#9B9B9B" font-size="13" letter-spacing="2.5" font-weight="600">THE PROBLEM</text>
  <text x="80" y="116" fill="#1A1A1A" font-size="28" font-weight="500">One loop, three broken stages</text>

  <!-- stage nodes -->
  <!-- Save -->
  <circle cx="220" cy="280" r="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="220" y="276" fill="#1A1A1A" font-size="18" font-weight="600" text-anchor="middle">Save</text>
  <text x="220" y="300" fill="#9B9B9B" font-size="12" text-anchor="middle">social</text>

  <!-- Plan -->
  <circle cx="520" cy="280" r="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="520" y="276" fill="#1A1A1A" font-size="18" font-weight="600" text-anchor="middle">Plan</text>
  <text x="520" y="300" fill="#9B9B9B" font-size="12" text-anchor="middle">the week</text>

  <!-- Shop -->
  <circle cx="820" cy="280" r="58" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="820" y="276" fill="#1A1A1A" font-size="18" font-weight="600" text-anchor="middle">Shop</text>
  <text x="820" y="300" fill="#9B9B9B" font-size="12" text-anchor="middle">groceries</text>

  <!-- Cook -->
  <circle cx="1080" cy="280" r="58" fill="#1A1A1A"/>
  <text x="1080" y="276" fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">Cook</text>
  <text x="1080" y="300" fill="#9B9B9B" font-size="12" text-anchor="middle">finally</text>

  <!-- broken connectors (rose dashed with break gap) -->
  <line x1="282" y1="280" x2="458" y2="280" stroke="#F43F5E" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="582" y1="280" x2="758" y2="280" stroke="#F43F5E" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="882" y1="280" x2="1018" y2="280" stroke="#E5E5E5" stroke-width="2"/>

  <!-- break markers -->
  <g>
    <line x1="362" y1="262" x2="378" y2="298" stroke="#F43F5E" stroke-width="2.5"/>
    <line x1="378" y1="262" x2="362" y2="298" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="370" y="346" fill="#F43F5E" font-size="12" text-anchor="middle">saves scatter</text>
  </g>
  <g>
    <line x1="662" y1="262" x2="678" y2="298" stroke="#F43F5E" stroke-width="2.5"/>
    <line x1="678" y1="262" x2="662" y2="298" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="670" y="346" fill="#F43F5E" font-size="12" text-anchor="middle">planned by hand</text>
  </g>

  <!-- caption -->
  <text x="80" y="420" fill="#6B6B6B" font-size="15">Inspiration expires at stage one. Effort repeats at stage two. The habit never forms at stage three.</text>
</svg>
