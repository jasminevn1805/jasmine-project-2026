<svg width="720" height="540" viewBox="0 0 720 540" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="720" height="540" fill="#FAFAFA"/>

  <!-- eyebrow -->
  <text x="56" y="72" fill="#9B9B9B" font-size="12" letter-spacing="2.5" font-weight="600">PLANNER MODEL</text>
  <text x="56" y="104" fill="#1A1A1A" font-size="24" font-weight="500">Two modes, one discriminated union</text>

  <!-- Calendar plan -->
  <rect x="56" y="148" width="272" height="220" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="80" y="182" fill="#1A1A1A" font-size="15" font-weight="600">Calendar mode</text>
  <text x="80" y="202" fill="#9B9B9B" font-size="11" font-family="monospace">mode: 'calendar'</text>
  <!-- mini week grid -->
  <g stroke="#E5E5E5" stroke-width="1">
    <rect x="80" y="220" width="224" height="120" rx="6" fill="#FAFAFA"/>
    <line x1="80" y1="250" x2="304" y2="250"/>
    <line x1="80" y1="280" x2="304" y2="280"/>
    <line x1="80" y1="310" x2="304" y2="310"/>
    <line x1="112" y1="220" x2="112" y2="340"/>
    <line x1="144" y1="220" x2="144" y2="340"/>
    <line x1="176" y1="220" x2="176" y2="340"/>
    <line x1="208" y1="220" x2="208" y2="340"/>
    <line x1="240" y1="220" x2="240" y2="340"/>
    <line x1="272" y1="220" x2="272" y2="340"/>
  </g>
  <rect x="116" y="254" width="24" height="9" rx="2" fill="#1A1A1A"/>
  <rect x="180" y="284" width="24" height="9" rx="2" fill="#1A1A1A"/>
  <rect x="244" y="314" width="24" height="9" rx="2" fill="#1A1A1A"/>
  <text x="80" y="358" fill="#6B6B6B" font-size="11">breakfast · lunch · dinner · snack · copy-week</text>

  <!-- Freeform plan -->
  <rect x="392" y="148" width="272" height="220" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="416" y="182" fill="#1A1A1A" font-size="15" font-weight="600">Freeform mode</text>
  <text x="416" y="202" fill="#9B9B9B" font-size="11" font-family="monospace">mode: 'freeform'</text>
  <!-- grouped chips -->
  <text x="416" y="234" fill="#9B9B9B" font-size="11">Mains</text>
  <rect x="416" y="244" width="80" height="22" rx="11" fill="#F5F5F5"/>
  <rect x="504" y="244" width="96" height="22" rx="11" fill="#F5F5F5"/>
  <text x="416" y="296" fill="#9B9B9B" font-size="11">Sides</text>
  <rect x="416" y="306" width="72" height="22" rx="11" fill="#F5F5F5"/>
  <rect x="496" y="306" width="64" height="22" rx="11" fill="#F5F5F5"/>
  <text x="416" y="358" fill="#6B6B6B" font-size="11">grouped by meal type · no dates</text>

  <!-- union into one store -->
  <line x1="192" y1="368" x2="192" y2="404" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="528" y1="368" x2="528" y2="404" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="192" y1="404" x2="528" y2="404" stroke="#E5E5E5" stroke-width="1.5"/>
  <line x1="360" y1="404" x2="360" y2="428" stroke="#1A1A1A" stroke-width="1.5"/>

  <rect x="208" y="428" width="304" height="56" rx="10" fill="#F5F5F5" stroke="#E5E5E5" stroke-width="1.5"/>
  <text x="360" y="454" fill="#1A1A1A" font-size="14" font-weight="600" text-anchor="middle" font-family="monospace">CalendarPlan | FreeformPlan</text>
  <text x="360" y="474" fill="#6B6B6B" font-size="12" text-anchor="middle">one Zustand store · the compiler enforces the difference</text>
</svg>
